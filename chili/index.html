<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico">
<title>Chili — ai.bitbashers.org</title>
<style>
  :root{
    --bg:#14100c; --panel:#1f1812; --line:#3a2d20;
    --txt:#f3e9dc; --dim:#c9b49a; --faint:#8a7560;
    --heat:#e25822; --heat2:#ffb347; --gold:#d9a441;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .banner{background:radial-gradient(900px 420px at 50% -10%,#3a2413 0%,#1c130b 55%,#14100c 100%);
          border-bottom:1px solid var(--line);
          padding:2.6rem 1.2rem 2rem;text-align:center}
  .banner a.back{display:inline-block;margin-bottom:.6rem;color:var(--faint);text-decoration:none;font-size:.9rem}
  .banner a.back:hover{color:var(--txt)}
  .banner h1{margin:.3rem 0 .3rem;font-size:clamp(1.8rem,5vw,2.6rem)}
  .banner p{color:var(--dim);margin:.3rem auto 0;max-width:32rem}
  main{max-width:56rem;margin:0 auto;padding:2rem 1.2rem 4rem}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:1.1rem}
  a.tile{display:block;text-decoration:none;color:inherit;background:var(--panel);
         border:1px solid var(--line);border-radius:16px;padding:1.4rem 1.3rem;
         transition:transform .12s ease,border-color .12s ease}
  a.tile:hover{transform:translateY(-3px);border-color:var(--heat)}
  a.tile .icon{font-size:2rem}
  a.tile h2{margin:.6rem 0 .3rem;font-size:1.25rem}
  a.tile p{margin:0 0 .8rem;color:var(--dim);font-size:.93rem}
  a.tile .go{color:var(--heat2);font-weight:600;font-size:.9rem}
  footer{text-align:center;color:var(--faint);font-size:.8rem;padding:0 1.2rem 2rem}
</style>
</head>
<body>
  <div class="banner">
    <a class="back" href="../index.html">← Home</a>
    <h1>🌶️ Chili</h1>
    <p>One tile per recipe. Pick your fighter.</p>
  </div>
  <main>
    <div class="tiles">
      <a class="tile" href="pork.html">
        <div class="icon">🌶️</div>
        <h2>Pork Chili</h2>
        <p>Mesquite-smoked pork with red beans, finished in the crock pot. Cook-day command center.</p>
        <span class="go">Open →</span>
      </a>
      <a class="tile" href="lamb.html">
        <div class="icon">🍖</div>
        <h2>Lamb Chili</h2>
        <p>Rick Bayless-style lamb chili with mushrooms and pasilla peppers.</p>
        <span class="go">Open →</span>
      </a>
    </div>
  </main>
  <footer>Staged and ready.</footer>
</body>
</html>
